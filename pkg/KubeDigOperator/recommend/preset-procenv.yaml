apiVersion: security.kubedig.com/v1
kind: KubeDigClusterPolicy
metadata:
  annotations:
    app.accuknox.com/source: KubeDig Operator
    app.accuknox.com/type: preset
  name: preset-proc-env
spec:
  presets:
  - action: Block
    name: protectEnv
  message: Alert! a process is trying to access env of another process 
  selector:
    matchExpressions:
  severity: 5
   
