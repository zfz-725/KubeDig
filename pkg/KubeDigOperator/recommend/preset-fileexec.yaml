apiVersion: security.kubedig.com/v1
kind: KubeDigClusterPolicy
metadata:
  annotations:
    app.accuknox.com/source: KubeDig Operator
    app.accuknox.com/type: preset
  name: preset-fileexec
spec:
  presets:
  - action: Block
    name: filelessExec
  message: Alert! Fileless exec operation is detected
  selector:
    matchExpressions:
  severity: 5
   
